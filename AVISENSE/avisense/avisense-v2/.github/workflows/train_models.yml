name: Automated Model Training

on:
  # Run monthly on the 1st at 2 AM UTC
  schedule:
    - cron: '0 2 1 * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to train (comma-separated)'
        required: false
        default: 'vae,lstm_ae'
      days:
        description: 'Days of data to use'
        required: false
        default: '30'

jobs:
  retrain-models:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install -r requirements-deep.txt
      
      - name: Download training data
        run: |
          # Download from S3 or Supabase Storage
          # This is a placeholder - adjust for your setup
          mkdir -p backend/data/processed
          # aws s3 cp s3://your-bucket/train.npz backend/data/processed/
      
      - name: Run automated retraining
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd backend
          python scripts/automated_retrain.py \
            --models ${{ github.event.inputs.models || 'vae,lstm_ae' }} \
            --days ${{ github.event.inputs.days || '30' }} \
            --min-feedback 100 \
            --min-auroc 0.90
      
      - name: Upload model artifacts
        uses: actions/upload-artifact@v3
        with:
          name: trained-models
          path: backend/models/deep/*_v*.pt
          retention-days: 90
      
      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: 'Model Training Failed'
          body: 'Automated model training workflow failed. Check GitHub Actions logs.'
          to: ${{ secrets.ALERT_EMAIL }}
          from: 'Avisense CI/CD'
