# Training Configuration for CMAPSS Models

data:
  raw_path: "/Users/dakshupadhayay/Desktop/engine-failure-detection-/AVISENSE/avisense/CMaps/train_FD001.txt"
  processed_dir: "backend/data/processed"
  sequence_length: 30
  sensors_to_drop: 
    - "setting_3"
    - "sensor_1"
    - "sensor_5"
    - "sensor_10"
    - "sensor_16"
    - "sensor_18"
    - "sensor_19"
  rul_cap: 125
  failure_threshold: 30 # Cycles before failure to label as "PRONE TO FAILURE" (1)

training:
  seed: 42
  cv_folds: 5 # Engine-wise K-Fold
  optuna_trials: 20 # Reduced for speed, increase for production
  
  rul_model:
    hidden_dim_range: [32, 128]
    num_layers_range: [1, 3]
    dropout_range: [0.1, 0.5]
    lr_range: [0.0001, 0.01]
    batch_size: 64
    epochs: 50 # Early stopping will be used

  classifier_model:
    type: "RandomForest" # or "XGBoost"
    n_estimators_range: [50, 200]
    max_depth_range: [5, 20]
    calibration_method: "isotonic" # or "sigmoid" (Platt)

output:
  models_dir: "backend/app/ml/models"
  metadata_dir: "backend/app/ml/models"
